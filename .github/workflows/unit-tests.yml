name: Host-light unit tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # The list lives in pyproject's [project.optional-dependencies], and
          # is read out of it rather than repeated here, so the two cannot
          # drift. It is read rather than installed with `pip install .[test]`
          # because this bundle's build backend is ChimeraX's own: there is no
          # ChimeraX on a CI runner, so the project cannot be built at all —
          # only its dependencies installed.
          python -m pip install $(python -c "import tomllib; print(' '.join(tomllib.load(open('pyproject.toml','rb'))['project']['optional-dependencies']['test']))")
          python -m pip install -e ./mcp
      - name: Ruff
        run: ruff check src tests mcp
      - name: Pytest (host-light)
        run: pytest tests mcp/tests
      - name: Whitespace hygiene
        run: git diff --check
