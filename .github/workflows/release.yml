name: Release

# One tag, two artefacts, two destinations. `molcompose-mcp` is an ordinary
# Python package and goes to PyPI; the ChimeraX bundle cannot, because its
# build backend is ChimeraX's own `cx_pep517` and there is no ChimeraX on a
# runner — so its wheel is built on a machine that has one and uploaded to the
# release by hand. The Toolshed is where users actually get it.
#
# Tag format decides what runs:
#   v0.1.3       the bundle release; makes the GitHub Release for the hand-built wheel
#   mcp-v0.1.2   the agent bridge; builds, checks and publishes to PyPI
#
# Two prefixes rather than one tag for both, because the two version numbers
# move independently: the bundle is at 0.1.3 while the bridge is at 0.1.2, and
# a shared tag would force a version bump on whichever did not change.

on:
  push:
    tags:
      - "v*"
      - "mcp-v*"

permissions:
  contents: write        # to create the GitHub Release and attach files

jobs:
  tests:
    name: Test the release commit
    uses: ./.github/workflows/unit-tests.yml

  # ---------------------------------------------------------------- bridge --
  pypi:
    name: Publish molcompose-mcp to PyPI
    if: startsWith(github.ref, 'refs/tags/mcp-v')
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/molcompose-mcp
    permissions:
      contents: write
      id-token: write    # PyPI trusted publishing; no API token in secrets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip build twine

      - name: The tag has to agree with the package, in both files
        # A tag is what people cite and what the Release page shows; a package
        # whose version differs from its tag makes both wrong, and the mistake
        # is unfixable on PyPI because a version can never be re-uploaded.
        run: |
          TAG="${GITHUB_REF_NAME#mcp-v}"
          PKG=$(python -c "import tomllib;print(tomllib.load(open('mcp/pyproject.toml','rb'))['project']['version'])")
          SRC=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"',open('mcp/molcompose_mcp/__init__.py').read()).group(1))")
          echo "tag=$TAG pyproject=$PKG source=$SRC"
          test "$TAG" = "$PKG"
          test "$TAG" = "$SRC"

      - name: Reuse an existing GitHub release artifact set
        id: github_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS=$(curl --silent --show-error \
            --output "$RUNNER_TEMP/github-release.json" \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}")
          case "$STATUS" in
            200)
              mkdir -p dist
              gh release download "$GITHUB_REF_NAME" \
                --dir dist --pattern "*.whl" --pattern "*.tar.gz"
              echo "exists=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "GitHub release lookup failed with HTTP $STATUS" >&2
              exit 1
              ;;
          esac

      - name: Build sdist and wheel once
        if: steps.github_release.outputs.exists != 'true'
        run: python -m build mcp --outdir dist

      - name: Check the metadata renders
        # PyPI rejects a bad long_description at upload, after the version is
        # already spent on a failed attempt.
        run: twine check dist/*

      - name: Validate the exact artifacts
        id: artifacts
        run: |
          TAG="${GITHUB_REF_NAME#mcp-v}"
          python scripts/validate_release_artifacts.py \
            --dist-dir dist \
            --expected-name molcompose-mcp \
            --expected-version "$TAG" \
            --github-output "$GITHUB_OUTPUT"

      - name: Compare an existing immutable PyPI release
        id: pypi_release
        run: |
          STATUS=$(curl --silent --show-error \
            --output "$RUNNER_TEMP/pypi-release.json" \
            --write-out "%{http_code}" \
            "https://pypi.org/pypi/molcompose-mcp/${{ steps.artifacts.outputs.version }}/json")
          case "$STATUS" in
            200)
              python scripts/validate_release_artifacts.py \
                --dist-dir dist \
                --expected-name molcompose-mcp \
                --expected-version "${{ steps.artifacts.outputs.version }}" \
                --pypi-json "$RUNNER_TEMP/pypi-release.json"
              echo "exists=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "PyPI release lookup failed with HTTP $STATUS" >&2
              exit 1
              ;;
          esac

      - name: Attach the same files to a GitHub Release
        if: steps.github_release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          # Use the validator's exact filenames rather than a broad dist glob.
          # PyPI receives these same two files in the following step.
          files: |
            dist/${{ steps.artifacts.outputs.wheel }}
            dist/${{ steps.artifacts.outputs.sdist }}
          generate_release_notes: true

      - name: Publish the validated files to PyPI
        if: steps.pypi_release.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

  # ---------------------------------------------------------------- bundle --
  bundle:
    name: Open the release for the ChimeraX bundle
    if: startsWith(github.ref, 'refs/tags/v')
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: The tag has to agree with the bundle, in both files
        id: bundle-version
        # `pyproject.toml` decides what the Toolshed serves; `src/__init__.py`
        # decides the string written into every provenance record and .cxc
        # header. A figure citing a version that was never released is the one
        # claim the record exists to prevent, so the tag is checked against
        # both rather than against whichever is easier to read.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          SRC=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"',open('src/__init__.py').read()).group(1))")
          echo "tag=$TAG pyproject=$PKG source=$SRC"
          test "$TAG" = "$PKG"
          test "$TAG" = "$SRC"
          echo "version=$PKG" >> "$GITHUB_OUTPUT"

      - name: Create the release
        # Without a wheel: it is built where ChimeraX is and uploaded to this
        # release afterwards, either by hand or with
        #   gh release upload "$TAG" dist/chimerax_molcompose-*.whl
        # The release is opened here so the tag, the notes and the checks are
        # one automated step and only the artefact is manual.
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Install from the [ChimeraX Toolshed](https://cxtoolshed.rbvi.ucsf.edu/apps/chimeraxmolcompose),
            or, once the matching wheel has been attached to this release,
            download it and run, in ChimeraX's command line:

            ```
            toolshed install /path/to/chimerax_molcompose-${{ steps.bundle-version.outputs.version }}-py3-none-any.whl
            ```

            Then quit ChimeraX and start it again — a running ChimeraX keeps
            the modules it has already loaded.
